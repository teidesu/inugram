name: build

on:
  workflow_call:
    inputs:
      artifact-name:
        required: true
        type: string
    outputs:
      apk-full-name:
        value: ${{ jobs.build.outputs.apk-full-name }}
      apk-pluginless-name:
        value: ${{ jobs.build.outputs.apk-pluginless-name }}
      ver-name:
        value: ${{ jobs.build.outputs.ver-name }}
      ver-code:
        value: ${{ jobs.build.outputs.ver-code }}
      app-ver-code:
        value: ${{ jobs.build.outputs.app-ver-code }}
      build-num:
        value: ${{ jobs.build.outputs.build-num }}
      tag:
        value: ${{ jobs.build.outputs.tag }}
  pull_request:
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/build.yml'
  push:
    branches: [main, next]
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  ARTIFACT_NAME: ${{ inputs.artifact-name || format('inugram-build-{0}', github.run_id) }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            worktree: worktree
          - variant: pluginless
            worktree: worktree-pluginless
    outputs:
      apk-full-name: ${{ steps.info.outputs.apk-full-name }}
      apk-pluginless-name: ${{ steps.info.outputs.apk-pluginless-name }}
      ver-name: ${{ steps.info.outputs.ver-name }}
      ver-code: ${{ steps.info.outputs.ver-code }}
      app-ver-code: ${{ steps.info.outputs.app-ver-code }}
      build-num: ${{ steps.info.outputs.build-num }}
      tag: ${{ steps.info.outputs.tag }}
    steps:
      - name: free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: configure git identity
        run: |
          git config --global user.email ci@inugram
          git config --global user.name 'inugram ci'

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # rquickjs-sys always runs bindgen, which loads the clang C api; the runner image ships the
      # clang drivers without libclang.so
      - name: install libclang
        if: matrix.variant == 'full'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libclang-dev

      - name: cache cargo
        if: matrix.variant == 'full'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/native/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src/native/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: install android rust toolchain
        if: matrix.variant == 'full'
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked

      # the plugin engine's own suite, including every bundled oracle; ubuntu-latest already ships
      # rustup and a stable toolchain
      - name: test (plugin engine)
        if: matrix.variant == 'full'
        working-directory: src/native
        run: cargo test --locked

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: set up ccache
        uses: hendrikmuhs/ccache-action@e42e6681d2906409c5dde4a315af6214eaa890ee # v1.2
        with:
          append-timestamp: true
          key: ${{ runner.os }}-ndk-27.2-release-${{ matrix.variant }}
          restore-keys: |
            ${{ runner.os }}-ndk-27.2-release-${{ matrix.variant }}
            ${{ runner.os }}-ndk-27.2-release
            ${{ runner.os }}-
          max-size: 5G
          verbose: 2

      - name: set up worktree
        run: pnpm run setup -- --ci ${{ matrix.variant == 'pluginless' && '--pluginless' || '' }}

      # the node --check loop plus both tsc projects: the plugin contract, and the bundled plugins
      # against it - a bundled oracle that lost a member reads as a refusal and passes without this
      - name: typecheck (plugin contract + bundled plugins)
        if: matrix.variant == 'full'
        run: pnpm run typecheck-plugins

      # the two typings files the tl generator writes, which the sdk publish in release.yml needs and
      # cannot make without a worktree of its own
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.variant == 'full'
        with:
          name: ${{ env.ARTIFACT_NAME }}-sdk
          path: |
            sdk/types/android.tl.d.ts
            sdk/types/tl-names.txt
          if-no-files-found: error
          retention-days: 1

      - name: compute build info
        id: info
        env:
          INU_BUILD: ${{ vars.INU_BUILD || '1' }}
        run: pnpm tsx scripts/ci/version.ts ${{ matrix.variant == 'pluginless' && '--pluginless' || '' }}

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-home-cache-cleanup: true
          cache-read-only: false

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: >-
            platforms;android-36
            build-tools;36.0.0
            cmake;3.31.6
            ndk;27.2.12479018

      - name: tune gradle
        run: |
          echo 'org.gradle.caching=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx8192m -Dfile.encoding=UTF-8 -XX:+UseParallelGC' >> ~/.gradle/gradle.properties
          echo 'android.native.buildOutput=verbose' >> ~/.gradle/gradle.properties

      # pure JVM, no android toolchain: the shared plugin policy plus the plugin bridge harness
      - name: test (InuCore + plugin bridge)
        working-directory: ${{ matrix.worktree }}
        run: ./gradlew --no-daemon :InuCore:check

      - name: reset ccache stats
        run: ccache -z

      - name: build (unsigned, debug-keyed)
        working-directory: ${{ matrix.worktree }}
        env:
          COMMIT_ID: ${{ github.sha }}
          INU_BUILD: ${{ steps.info.outputs.build-num }}
          INU_BUILD_TYPE: release
          CCACHE_COMPILERCHECK: content
          CCACHE_SLOPPINESS: time_macros,file_macro,include_file_mtime,include_file_ctime,locale,system_headers
          CCACHE_BASEDIR: ${{ github.workspace }}/${{ matrix.worktree }}
        run: ./gradlew --no-daemon :TMessagesProj_App:assembleRelease

      - name: show ccache stats
        if: always()
        run: ccache -s -v

      - name: stage artifacts
        run: |
          mkdir -p out
          apk='${{ matrix.variant == 'full' && steps.info.outputs.apk-full-name || steps.info.outputs.apk-pluginless-name }}'
          cp '${{ matrix.worktree }}/TMessagesProj_App/build/outputs/apk/release/app.apk' "out/$apk"
          if [ '${{ matrix.variant }}' != full ]; then
            exit 0
          fi

          base=$(git describe --tags --abbrev=0 --match 'v*' --exclude '${{ steps.info.outputs.tag }}' HEAD 2>/dev/null || true)
          jq -n \
            --arg verName '${{ steps.info.outputs.ver-name }}' \
            --argjson verCode '${{ steps.info.outputs.ver-code }}' \
            --argjson appVerCode '${{ steps.info.outputs.app-ver-code }}' \
            --argjson buildNum '${{ steps.info.outputs.build-num }}' \
            --arg apkFull '${{ steps.info.outputs.apk-full-name }}' \
            --arg apkPluginless '${{ steps.info.outputs.apk-pluginless-name }}' \
            --arg baseTag "$base" \
            --arg commitSha "$GITHUB_SHA" \
            --arg repo "$GITHUB_REPOSITORY" \
            '{verName:$verName,verCode:$verCode,appVerCode:$appVerCode,buildNum:$buildNum,apkFiles:{full:$apkFull,pluginless:$apkPluginless},baseTag:(if $baseTag == "" then null else $baseTag end),commitSha:$commitSha,repo:$repo}' \
            > out/build-info.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-unsigned-${{ matrix.variant }}
          path: out/*
          if-no-files-found: error
          retention-days: 1
