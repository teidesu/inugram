[package]
name = "inu_native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.23"
# the canvas colour vocabulary. android's own `Color.parseColor` covers hex and ~140 names and
# nothing else, so `rgb()`/`hsl()`/`hwb()`/`lab()` and the modern space-separated syntax would be a
# parser of our own; the font shorthand still is one, there being no crate for it.
csscolorparser = { version = "0.8", default-features = false, features = ["named-colors"] }
jni = "0.22"
# libart.so's real symtab ships xz-compressed in `.gnu_debugdata` on modern android, and the
# prefix resolver lsplant demands has to read it. pure rust, so `elf.rs` stays unit-testable.
lzma-rs = "0.3"
# rquickjs bundles quickjs-ng; `bindgen` is required because it ships no prebuilt Android bindings.
rquickjs = { version = "0.12", default-features = true, features = ["bindgen"] }
url = "2.5.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
